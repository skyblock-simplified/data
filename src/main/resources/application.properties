# Spring Boot application metadata
spring.application.name=data

# The servlet container listens on 8080 inside the private skyblock-hazelcast-net docker network
# and is never published to the host - Prometheus reaches /actuator/prometheus over docker-internal
# DNS. There are no REST controllers; the only endpoints served are Actuator's.
spring.main.web-application-type=servlet

# The transitive server-api dependency registers its API key security config under
# @ConditionalOnProperty(havingValue=true) and then requires an ApiKeyStore bean. There is nothing
# here to protect, so it stays off.
api.key.authentication.enabled=false

# Actuator: health/info/metrics plus the prometheus scrape endpoint, whose output comes from
# micrometer-registry-prometheus once it is on the classpath.
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=always
management.metrics.enable.jvm=true

# The corpus poll.
#   poll-interval-seconds: delay between the end of one cycle and the start of the next, so a slow
#     cycle never overlaps the one after it.
#   poll-enabled: master switch for the scheduled entry point. A poll is an observation - it
#     records which documents moved and rebuilds nothing.
skyblock.data.github.poll-interval-seconds=60
skyblock.data.github.poll-enabled=true

# The write path. The write instruction itself is the SKYBLOCK_GITHUB_TOKEN environment variable,
# read at startup: without one the corpus source is read-only and a write is refused rather than
# half-applied.
#   write-consumer-enabled: master switch for the drain thread.
#   write-retry-max-attempts: how many retries a failed write gets before it is dead-lettered to
#     skyblock.writes.deadletter for an operator.
#   write-retry-initial-delay-minutes: the delay before the first retry, doubling each attempt.
skyblock.data.github.write-consumer-enabled=true
skyblock.data.github.write-retry-max-attempts=5
skyblock.data.github.write-retry-initial-delay-minutes=1
